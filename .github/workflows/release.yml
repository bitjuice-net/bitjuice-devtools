name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test DevTools.sln -c Release

      - name: Publish
        run: ./publish.sh "$VERSION"

      - name: Package
        run: |
          mkdir -p dist
          (cd publish/win-x64 && zip -r "../../dist/devtools-$VERSION-win-x64.zip" .)
          tar -czf "dist/devtools-$VERSION-linux-x64.tar.gz" -C publish/linux-x64 .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease
